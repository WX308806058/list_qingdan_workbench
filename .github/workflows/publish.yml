name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 从 tag 同步版本号
        shell: bash
        run: |
          # GITHUB_ENV 只对「后续」步骤生效，同一步里读不到——
          # 之前用 node 读 process.env.VERSION 拿到 undefined，
          # 把 Cargo.toml 写成 version = "undefined"，cargo metadata 直接崩。
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          sed -i 's/"version": "[^"]*"/"version": "'"$VERSION"'"/' package.json
          sed -i 's/"version": "[^"]*"/"version": "'"$VERSION"'"/' src-tauri/tauri.conf.json
          sed -i '0,/^version = "[^"]*"/s//version = "'"$VERSION"'"/' src-tauri/Cargo.toml

          echo "--- 校验 ---"
          grep -m1 '"version"' package.json
          grep -m1 '"version"' src-tauri/tauri.conf.json
          grep -m1 '^version' src-tauri/Cargo.toml

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 安装 PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: 打包 Python sidecar
        env:
          # runner 默认 cp1252，脚本里的中文输出会直接崩
          PYTHONIOENCODING: utf-8
        run: python scripts/build-sidecar.py

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "清单工作台 v__VERSION__"
          releaseBody: |
            自动构建产物。
            安装包：`清单工作台_<版本>_x64-setup.exe`
            已安装旧版本的用户无需手动下载，应用启动时会自动升级。
          releaseDraft: false
          prerelease: false

      # GitHub 直连在国内常常很慢，把 latest.json 里的下载地址改写成 gh-proxy 镜像。
      # 注意：signature 字段必须原样保留（就是 .sig 文件内容），只改 url。
      - name: 改写 latest.json 为国内镜像
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern latest.json --clobber
          node -e "
            const fs=require('fs');
            const j=JSON.parse(fs.readFileSync('latest.json','utf8'));
            for (const p of Object.values(j.platforms||{})) {
              if (p.url && !p.url.startsWith('https://gh-proxy.com/')) {
                p.url = 'https://gh-proxy.com/' + p.url;
              }
            }
            fs.writeFileSync('latest.json', JSON.stringify(j,null,2));
          "
          gh release delete-asset "$GITHUB_REF_NAME" latest.json --yes
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber
