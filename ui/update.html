<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>正在更新</title>
<style>
  html, body {
    margin: 0; height: 100%;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: #f7f8fa; color: #1d2939;
    user-select: none; overflow: hidden;
  }
  .wrap {
    height: 100%; display: flex; flex-direction: column;
    justify-content: center; padding: 0 26px; box-sizing: border-box;
  }
  h1 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
  .ver { font-size: 12px; color: #667085; margin-bottom: 16px; }
  .bar {
    height: 8px; border-radius: 4px; background: #e4e7ec; overflow: hidden;
  }
  .bar i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, #4a84f0, #2f6bd8);
    border-radius: 4px;
    transition: width .3s ease;
  }
  .indeterminate i {
    width: 40% !important;
    animation: slide 1.1s ease-in-out infinite;
  }
  @keyframes slide {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(280%); }
  }
  .step { margin-top: 10px; font-size: 11.5px; color: #667085; min-height: 16px; }
  .ico {
    position: absolute; top: 14px; right: 18px; width: 30px; height: 30px;
    border-radius: 8px;
    background: linear-gradient(135deg, #5694f8, #143684);
    display: flex; align-items: center; justify-content: center;
  }
  .ico::after {
    content: '✓'; color: #fff; font-size: 15px; font-weight: 700;
  }
</style>
</head>
<body>
  <div class="ico"></div>
  <div class="wrap">
    <h1>正在更新 清单工作台</h1>
    <div class="ver" id="ver">准备中…</div>
    <div class="bar" id="bar"><i id="fill"></i></div>
    <div class="step" id="step">正在检查更新</div>
  </div>
<script>
  window.__upd = function (pct, label) {
    var fill = document.getElementById('fill');
    var bar  = document.getElementById('bar');
    var step = document.getElementById('step');
    if (pct === null) {                 // 不定进度（安装阶段没有百分比）
      bar.classList.add('indeterminate');
    } else {
      bar.classList.remove('indeterminate');
      fill.style.width = Math.max(2, Math.min(100, pct)) + '%';
    }
    if (label) step.textContent = label;
  };
  window.__ver = function (v) {
    document.getElementById('ver').textContent = '正在升级到 ' + v;
  };
</script>
</body>
</html>
